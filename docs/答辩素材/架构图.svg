<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <!-- 坐姿监测小助手 · 系统架构图（答辩投影用，浅色底） -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">坐姿监测小助手 · 系统架构</text>
  <text x="620" y="70" text-anchor="middle" font-size="14" fill="#64748b">本地视觉坐姿识别与桌面提醒 · 判定与提醒分离 · 全链路可测</text>

  <!-- ============ Worker 线程带 ============ -->
  <rect x="40" y="96" width="880" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="122" font-size="14" font-weight="bold" fill="#475569">采集 / 推理线程（Worker QThread）</text>

  <!-- 采集 -->
  <rect x="70" y="150" width="180" height="84" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">摄像头采集</text>
  <text x="160" y="204" text-anchor="middle" font-size="11" fill="#1e40af">cv2.VideoCapture</text>
  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#1e40af">推理宽 640 · 降载</text>

  <!-- 推理 -->
  <rect x="290" y="150" width="180" height="84" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">姿态估计</text>
  <text x="380" y="204" text-anchor="middle" font-size="11" fill="#1e40af">MediaPipe Pose</text>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#1e40af">33 关键点 · 复杂度 0/1</text>

  <!-- 指标 -->
  <rect x="510" y="150" width="180" height="84" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">指标提取</text>
  <text x="600" y="204" text-anchor="middle" font-size="11" fill="#166534">geometry.py / metrics.py</text>
  <text x="600" y="222" text-anchor="middle" font-size="11" fill="#166534">θ 颈偏角 · d 低头比值等</text>

  <!-- 判定 -->
  <rect x="730" y="150" width="170" height="84" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="815" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">滤波 · 分级</text>
  <text x="815" y="204" text-anchor="middle" font-size="11" fill="#166534">5 帧中值滤波</text>
  <text x="815" y="222" text-anchor="middle" font-size="11" fill="#166534">迟滞分级 good/warn/bad</text>

  <!-- 采集→推理→指标→判定 -->
  <line x1="250" y1="192" x2="288" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="192" x2="508" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="192" x2="728" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 坐标系注释 -->
  <rect x="70" y="248" width="420" height="34" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="80" y="270" font-size="11" fill="#9a3412">约定：像素原点左上、y 向下；低头用比值 d 而非角度（正面相机下角度公式退化）</text>

  <!-- ============ 决策带 ============ -->
  <rect x="40" y="356" width="880" height="150" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="60" y="382" font-size="14" font-weight="bold" fill="#9a3412">决策层 · 判定与提醒分离（posture_rules 只答"现在好不好"，reminder_engine 管"何时响"）</text>

  <rect x="70" y="400" width="380" height="84" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="260" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">提醒状态机 reminder_engine.py</text>
  <text x="260" y="454" text-anchor="middle" font-size="11" fill="#9a3412">NORMAL → COUNTDOWN → ALERTED → SNOOZED</text>
  <text x="260" y="472" text-anchor="middle" font-size="11" fill="#9a3412">15s 才响 · 300s 冷却 · 600s 升级 severe · 防疲劳</text>

  <rect x="480" y="400" width="220" height="84" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="590" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">久坐追踪</text>
  <text x="590" y="454" text-anchor="middle" font-size="11" fill="#9a3412">sedentary.py · 45 分钟</text>
  <text x="590" y="472" text-anchor="middle" font-size="11" fill="#9a3412">离座清零 · 冷却防轰炸</text>

  <rect x="730" y="400" width="170" height="84" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="815" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">防疲劳三件套</text>
  <text x="815" y="454" text-anchor="middle" font-size="11" fill="#991b1b">迟滞 · 冷却</text>
  <text x="815" y="472" text-anchor="middle" font-size="11" fill="#991b1b">静默时段 23:00-08:00</text>

  <!-- 判定→决策 -->
  <line x1="815" y1="234" x2="815" y2="356" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 700 356 L 700 340 L 260 340 L 260 398" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 700 340 L 590 340 L 590 398" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ UI 带 ============ -->
  <rect x="40" y="526" width="880" height="118" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="60" y="552" font-size="14" font-weight="bold" fill="#5b21b6">交互层（UI 线程 · PySide6）← Qt Signal 跨线程排队</text>

  <rect x="70" y="566" width="330" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="235" y="592" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">系统托盘</text>
  <text x="235" y="614" text-anchor="middle" font-size="11" fill="#5b21b6">三色圆点状态 · 气泡提醒 · 菜单（报告/校准/小睡/设置）</text>

  <rect x="430" y="566" width="220" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="540" y="592" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">设置窗口</text>
  <text x="540" y="614" text-anchor="middle" font-size="11" fill="#5b21b6">阈值 / 提醒 / 静默 / 开机自启</text>

  <rect x="680" y="566" width="220" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="790" y="592" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">settings.py</text>
  <text x="790" y="614" text-anchor="middle" font-size="11" fill="#5b21b6">settings.json 持久化 · 热更提醒参数</text>

  <!-- 决策→UI（都指向托盘：提醒最终从托盘气泡出口） -->
  <line x1="260" y1="484" x2="185" y2="564" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="590" y1="484" x2="330" y2="564" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 设置→决策/采集（配置流，绿色虚线） -->
  <path d="M 540 566 L 540 520 L 360 520 L 360 506" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="392" y="514" font-size="10" fill="#059669">阈值/参数下发</text>

  <!-- ============ 数据带 ============ -->
  <rect x="40" y="664" width="880" height="152" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="690" font-size="14" font-weight="bold" fill="#334155">数据与评估层</text>

  <rect x="70" y="706" width="190" height="88" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="738" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">CSV 记录</text>
  <text x="165" y="760" text-anchor="middle" font-size="11" fill="#334155">storage.py · 1 Hz 落盘</text>
  <text x="165" y="778" text-anchor="middle" font-size="11" fill="#334155">指标+分级，不含图像</text>

  <rect x="290" y="706" width="180" height="88" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="738" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">阈值校准</text>
  <text x="380" y="760" text-anchor="middle" font-size="11" fill="#334155">warn≈不良 P15</text>
  <text x="380" y="778" text-anchor="middle" font-size="11" fill="#334155">recover≈正常 P85</text>

  <rect x="500" y="706" width="180" height="88" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="590" y="738" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">日报 · 周报</text>
  <text x="590" y="760" text-anchor="middle" font-size="11" fill="#334155">report.py / weekly.py</text>
  <text x="590" y="778" text-anchor="middle" font-size="11" fill="#334155">时间线 · TOP 时段 · 趋势图</text>

  <rect x="710" y="706" width="190" height="88" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="805" y="738" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">对比实验</text>
  <text x="805" y="760" text-anchor="middle" font-size="11" fill="#991b1b">benchmark.py</text>
  <text x="805" y="778" text-anchor="middle" font-size="11" fill="#991b1b">MediaPipe vs YOLO 速度/检出/稳定</text>

  <!-- 管线→CSV：从判定输出分支，沿最左侧空白通道走，不穿任何方框 -->
  <path d="M 815 300 L 52 300 L 52 750 L 68 750" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="58" y="742" font-size="10" fill="#64748b" transform="rotate(-90 58 742)">每秒落盘</text>
  <!-- CSV → 校准 / 日报（带内上沿走线） -->
  <path d="M 165 706 L 165 698 L 380 698 L 380 704" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 165 698 L 590 698 L 590 704" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============ 右侧：质量保障面板 ============ -->
  <rect x="950" y="96" width="250" height="720" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1075" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">工程质量保障</text>

  <rect x="975" y="152" width="200" height="110" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1075" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">96 个单测</text>
  <text x="1075" y="206" text-anchor="middle" font-size="11" fill="#166534">假时钟 · 合成关键点</text>
  <text x="1075" y="224" text-anchor="middle" font-size="11" fill="#166534">每层独立可测</text>
  <text x="1075" y="242" text-anchor="middle" font-size="11" fill="#166534">集成测试抓出状态机 bug</text>

  <rect x="975" y="282" width="200" height="110" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1075" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">测试模式</text>
  <text x="1075" y="336" text-anchor="middle" font-size="11" fill="#166534">FakeClock 钉死时间行为</text>
  <text x="1075" y="354" text-anchor="middle" font-size="11" fill="#166534">不依赖摄像头/模型</text>
  <text x="1075" y="372" text-anchor="middle" font-size="11" fill="#166534">缺依赖自动跳过</text>

  <rect x="975" y="412" width="200" height="110" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1075" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">配置即代码</text>
  <text x="1075" y="466" text-anchor="middle" font-size="11" fill="#166534">config.py 集中参数</text>
  <text x="1075" y="484" text-anchor="middle" font-size="11" fill="#166534">无魔法数字</text>
  <text x="1075" y="502" text-anchor="middle" font-size="11" fill="#166534">settings.json 用户可调</text>

  <rect x="975" y="542" width="200" height="110" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1075" y="572" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">隐私设计</text>
  <text x="1075" y="596" text-anchor="middle" font-size="11" fill="#166534">全本地推理</text>
  <text x="1075" y="614" text-anchor="middle" font-size="11" fill="#166534">图像不落盘不上传</text>
  <text x="1075" y="632" text-anchor="middle" font-size="11" fill="#166534">CSV 只存数值指标</text>

  <rect x="975" y="672" width="200" height="110" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1075" y="702" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">规模</text>
  <text x="1075" y="726" text-anchor="middle" font-size="11" fill="#166534">17 源码模块 · 12 测试文件</text>
  <text x="1075" y="744" text-anchor="middle" font-size="11" fill="#166534">约 4400 行</text>
  <text x="1075" y="762" text-anchor="middle" font-size="11" fill="#166534">Python / MediaPipe / PySide6</text>

  <!-- 图例 -->
  <text x="60" y="852" font-size="12" fill="#64748b">实线 = 数据流　虚线 = 配置/写回　蓝 = 采集推理　绿 = 指标判定　橙 = 决策　紫 = 交互　红 = 离线实验</text>
</svg>
